<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAVELIN DUEL</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── Lobby ── -->
<div id="lobby">
  <h1>JAVELIN<br><span>DUEL</span></h1>
  <p class="subtitle">1v1 Real-Time Spear Combat</p>

  <div class="lobby-panel">
    <label for="room-input">Room ID</label>
    <input id="room-input" type="text" maxlength="8" placeholder="ENTER CODE" autocomplete="off">
    <button class="btn btn-primary" id="join-btn">Join / Create Room</button>
    <hr class="divider">
    <p id="lobby-status"></p>
    <div class="controls-hint">
      <strong>A / D</strong> 移動 &nbsp;·&nbsp; <strong>W / Space</strong> 跳躍<br>
      <strong>按住左鍵</strong> 蓄力 &nbsp;·&nbsp; <strong>放開</strong> 投擲<br>
      <strong>F / Shift</strong> 閃避翻滾（短暫無敵）<br>
      走過掉落的標槍即可撿起
    </div>
  </div>
</div>

<!-- ── Game ── -->
<div id="game-wrap">
  <div id="hud">
    <div class="player-hud p1" id="hud-p1">
      <div>
        <div class="hud-name">YOU</div>
        <div class="hud-wins" id="wins-p1"></div>
      </div>
      <div class="hud-javelin" id="jav-p1">🗡 ×1</div>
    </div>
    <div class="hud-center" id="hud-center">ROUND 1</div>
    <div class="player-hud p2" id="hud-p2">
      <div>
        <div class="hud-name">ENEMY</div>
        <div class="hud-wins" id="wins-p2"></div>
      </div>
      <div class="hud-javelin" id="jav-p2">🗡 ×1</div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <div id="charge-bar-wrap">
    <span>Power</span>
    <div id="charge-bar-track"><div id="charge-bar-fill"></div></div>
    <span id="charge-pct">0%</span>
  </div>
</div>

<!-- ── Overlay (round/game end) ── -->
<div id="overlay">
  <div class="overlay-box">
    <div class="overlay-title" id="overlay-title">—</div>
    <div class="overlay-sub"  id="overlay-sub"></div>
    <div class="overlay-wins" id="overlay-wins"></div>
    <button class="btn btn-primary" id="overlay-btn">Next Round</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/game.js"></script>
</body>
</html>
